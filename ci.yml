name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: System packages (radare2 + compiler for the benign demo target)
        run: sudo apt-get update && sudo apt-get install -y radare2 gcc binutils
      - run: pip install -e ".[mcp,dev]"
      - name: Public hygiene (secrets, binaries, size)
        run: python scripts/check_public.py
      - name: Tests
        run: pytest -q
