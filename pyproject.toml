[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retriage"
version = "0.1.0"
description = "LLM-assisted static binary triage with radare2: hardened tools, MCP server, auditable reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["r2pipe>=1.8", "jsonschema>=4.18"]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]
dev = ["pytest>=7"]

[project.scripts]
retriage = "retriage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
